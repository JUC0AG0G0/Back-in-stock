name: Setup Node and pnpm
description: pnpm + Node from .nvmrc with the pnpm store cached, then a frozen install.
inputs:
  filter:
    description: Optional pnpm --filter for a partial install (empty = whole workspace)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm install --frozen-lockfile ${FILTER:+--filter "$FILTER"}
