name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Met à jour la PR "chore(main): release x.y.z" à chaque fusion sur main.
      # La fusionner crée le tag vX.Y.Z et la release GitHub.
      # RELEASE_PLEASE_TOKEN (PAT fine-grained ou token d'app) est nécessaire pour que
      # la CI se lance sur la PR de release ; sans lui, on retombe sur GITHUB_TOKEN.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: publish-image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: write
      packages: write
