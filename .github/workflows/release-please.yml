name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

# Two quick merges: the second run waits for the first instead of racing it on the release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Met à jour la PR "chore(main): release x.y.z" à chaque fusion sur main.
      # La fusionner crée le tag vX.Y.Z et la release GitHub.
      # release-please tourne via scripts/release-please/run.ts plutôt que via
      # googleapis/release-please-action : l'action ne sait pas charger la stratégie de
      # versionnement maison (refactor → mineure, voir scripts/release-please/versioning.ts).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Dépendances de la racine seulement (release-please), pas celles des apps.
      - uses: ./.github/actions/setup-node
        with:
          filter: back-in-stock

      # RELEASE_PLEASE_TOKEN (PAT fine-grained ou token d'app) est nécessaire pour que
      # la CI se lance sur la PR de release ; sans lui, on retombe sur GITHUB_TOKEN.
      - id: release
        run: node scripts/release-please/run.ts
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-image:
    name: publish-image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: write
      packages: write
