name: Docker image

# Publishes the image on ghcr.io/<owner>/back-in-stock:
#   - every merge to main          → :edge (latest development version)
#   - every release (release-please calls this workflow) → :X.Y.Z, :X.Y, :X, :latest,
#     plus docker-compose.yml, install scripts, SBOM and checksums attached to the GitHub release
#   - by hand (Actions → Docker image → Run workflow) to republish an existing release
#
# Each architecture builds on its own native runner (no QEMU emulation, which crashes Node
# on arm64), is smoke-tested, then pushed by digest. The "merge" job then names them.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/docs/**'
      - '**/*.md'
  workflow_call:
    inputs:
      version:
        description: Released version, e.g. 0.1.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version already released to publish again, e.g. 0.1.0 (empty = edge from main)
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.version || 'edge' }}
  cancel-in-progress: ${{ !inputs.version }}

env:
  # A release builds its tag; edge builds the pushed commit.
  REF: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
  # Only release images show the new version banner (SPEC §7quater); edge never looks for updates.
  BUILD_ARGS: |
    BIS_BUILD_CHANNEL=${{ inputs.version && 'release' || 'edge' }}
    BIS_VERSION=${{ inputs.version || 'edge' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      # Registry names must be lowercase, GitHub owners may not be.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/back-in-stock" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # Same image as the one pushed below (shared cache): never publish one that does not start.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: back-in-stock:smoke
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - run: scripts/docker-smoke.sh back-in-stock:smoke

      - id: push
        name: Push by digest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ env.BUILD_ARGS }}
          # No attestations in the registry: they show up as unnamed "sha256:…" versions
          # in the package page. The SBOM is attached to the release instead.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}

      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: tag
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/back-in-stock" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          # Annotations on the multi-arch index: links the package to this repository.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=edge,enable=${{ inputs.version == '' }}

      - name: Create the multi-arch image with its tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)

      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # Companion service of the one-click update (apps/updater): ghcr.io/<owner>/back-in-stock-updater.
  # Pure JavaScript, so one multi-arch build is enough (no native code, no emulated RUN step).
  updater:
    name: updater image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/back-in-stock-updater" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=edge,enable=${{ inputs.version == '' }}

      # Smoke test: the service starts and answers /health without a token.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.updater
          load: true
          tags: back-in-stock-updater:smoke
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max

      - name: Smoke test
        run: |
          docker run -d --name updater-smoke -p 127.0.0.1:18090:8090 back-in-stock-updater:smoke
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18090/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18090/health | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/status)" = 401
          docker rm -f updater-smoke

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=updater

  release-assets:
    name: release assets
    needs: merge
    if: inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/back-in-stock" >> "$GITHUB_ENV"
          mkdir -p dist

      # syft runs from its container image instead of anchore/sbom-action: the action downloads
      # syft from github.com/anchore/syft/releases, which answered 504 on the v0.2.0 release.
      # Two registries and a few retries, and a missing SBOM only warns: the compose file and
      # install scripts users need are still attached to the release.
      - name: SBOM of the published image
        id: sbom
        continue-on-error: true
        env:
          SYFT_VERSION: v1.42.3
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="dist/back-in-stock-$VERSION.sbom.spdx.json"
          for attempt in 1 2 3 4; do
            for syft in "ghcr.io/anchore/syft:$SYFT_VERSION" "docker.io/anchore/syft:$SYFT_VERSION"; do
              if docker run --rm \
                  -e SYFT_REGISTRY_AUTH_AUTHORITY -e SYFT_REGISTRY_AUTH_USERNAME -e SYFT_REGISTRY_AUTH_PASSWORD \
                  "$syft" scan "registry:$IMAGE:$VERSION" -o spdx-json > "$out.tmp"; then
                mv "$out.tmp" "$out"
                echo "SBOM written with $syft (attempt $attempt)"
                exit 0
              fi
              echo "::warning::syft via $syft failed (attempt $attempt)"
            done
            sleep $((attempt * 15))
          done
          rm -f "$out.tmp"
          echo "::warning::No SBOM for $VERSION: the other assets are attached anyway. Run 'Docker image' by hand with this version to add it."
          exit 1

      - name: docker-compose.yml pinned to this version
        run: |
          sed -e "s#back-in-stock:\${BIS_IMAGE_TAG:-latest}#back-in-stock:\${BIS_IMAGE_TAG:-$VERSION}#" \
              -e '/# To build from your local copy/,/dockerfile:/d' \
              docker-compose.yml > "dist/back-in-stock-$VERSION.docker-compose.yml"
          cat "dist/back-in-stock-$VERSION.docker-compose.yml"

      # Unversioned names: releases/latest/download/install.sh always points at the latest one.
      - name: Install scripts
        run: cp scripts/install.sh scripts/install.ps1 dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum back-in-stock-* install.sh install.ps1 > "back-in-stock-$VERSION.sha256sums.txt"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      # The image itself lives in the registry: the release notes say how to get it.
      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(gh release view "v$VERSION" --json body --jq .body --repo "$GITHUB_REPOSITORY")"
          if grep -q 'docker pull' <<< "$body"; then exit 0; fi
          {
            printf '%s\n\n' "$body"
            printf '## 🚀 Installation\n\n'
            printf 'macOS / Linux :\n\n```bash\ncurl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh\n```\n\n' "$GITHUB_REPOSITORY"
            printf 'Windows (PowerShell) :\n\n```powershell\nirm https://github.com/%s/releases/latest/download/install.ps1 | iex\n```\n\n' "$GITHUB_REPOSITORY"
            printf '## 🐳 Image Docker\n\n'
            printf '```bash\ndocker pull %s:%s\n```\n\n' "$IMAGE" "$VERSION"
            printf 'amd64 et arm64. Avec docker compose : télécharge `back-in-stock-%s.docker-compose.yml` ci-dessous.\n' "$VERSION"
          } > notes.md
          gh release edit "v$VERSION" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
