name: CI

# Pull requests only: the ruleset requires the branch to be up to date with main before
# merging, so the commit that lands on main has already passed this exact run.
# What runs after a merge lives elsewhere: release-please (release-please.yml), the :edge image
# (docker-publish.yml, which also builds and smoke-tests the image) and the docs.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      # Windows PowerShell 5.1 may decode a downloaded script with a legacy code page.
      - name: install.ps1 stays ASCII
        run: "! grep -nP '[^\\x00-\\x7F]' scripts/install.ps1"
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      # Simulates a contributor with a strict umask (files readable by owner only):
      # the image must not depend on host file permissions.
      - name: Restrict file permissions
        run: git ls-files -z | xargs -0 chmod go-rwx

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: back-in-stock:ci
          # Same scope as the amd64 build of docker-publish.yml: a PR reuses the layers of
          # the last :edge build on main (PR caches are not visible from main or other PRs).
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Smoke test Docker image
        run: scripts/docker-smoke.sh back-in-stock:ci

      - name: Build updater image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.updater
          load: true
          push: false
          tags: back-in-stock-updater:ci
          cache-from: type=gha,scope=updater

      # Starts, answers /health, and refuses calls without the token.
      - name: Smoke test updater image
        run: |
          docker run -d --name updater-ci -p 127.0.0.1:18090:8090 back-in-stock-updater:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18090/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18090/health | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/status)" = 401
          docker rm -f updater-ci

      # The installers, end to end, against the image built above (no download: BIS_SKIP_PULL).
      # Both must write the same files; only the port differs.
      - name: Test the installers
        env:
          BIS_VERSION: ci
          BIS_SKIP_PULL: '1'
          BIS_TZ: Europe/Paris
          BIS_LANG: en
          BIS_YES: '1'
        run: |
          docker tag back-in-stock:ci ghcr.io/juc0ag0g0/back-in-stock:ci
          BIS_DIR="$RUNNER_TEMP/bis-sh" BIS_PORT=18081 sh scripts/install.sh --yes
          BIS_DIR="$RUNNER_TEMP/bis-ps" BIS_PORT=18082 pwsh -NoProfile -File scripts/install.ps1
          curl -fsS http://127.0.0.1:18081/api/health
          curl -fsS http://127.0.0.1:18082/api/health
          diff "$RUNNER_TEMP/bis-sh/docker-compose.yml" "$RUNNER_TEMP/bis-ps/docker-compose.yml"
          diff <(sed /^BIS_PORT=/d "$RUNNER_TEMP/bis-sh/.env") <(sed /^BIS_PORT=/d "$RUNNER_TEMP/bis-ps/.env")
          # A second run updates in place and keeps the settings.
          BIS_DIR="$RUNNER_TEMP/bis-sh" BIS_PORT= sh scripts/install.sh --yes
          grep -qx BIS_PORT=18081 "$RUNNER_TEMP/bis-sh/.env"
          (cd "$RUNNER_TEMP/bis-sh" && docker compose down)
          (cd "$RUNNER_TEMP/bis-ps" && docker compose down)
