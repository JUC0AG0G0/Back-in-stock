packages:
  - 'apps/*'
  - 'packages/*'
  - 'plugins/*'

# Packages allowed to run install scripts (pnpm blocks them by default).
onlyBuiltDependencies:
  - esbuild

# Ships prebuilt binaries (glibc, musl, macOS, Windows): its node-gyp fallback is not needed.
ignoredBuiltDependencies:
  - better-sqlite3
  # Its install script only prints a funding banner (pulled by Docusaurus).
  - core-js
